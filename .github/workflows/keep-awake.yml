# Visits Juan's Streamlit apps twice a day so Streamlit Community Cloud never puts them to sleep.
name: Keep Streamlit apps awake
on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Visit apps (and press "wake up" if they are asleep)
        run: |
          npm init -y >/dev/null
          npm i playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > ping.js <<'JS'
          const { chromium } = require('playwright');
          const apps = [
            'https://app-churn-dashboard-sewwgnkcyn2jsfws76vefc.streamlit.app/',
            'https://conversational-bi-chatbot-fgvhbfceks96idjafzri9d.streamlit.app/',
          ];
          (async () => {
            const browser = await chromium.launch();
            for (const url of apps) {
              const page = await browser.newPage();
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 90000 });
              await page.waitForTimeout(8000);
              const wake = page.getByRole('button', { name: /get this app back up/i });
              if (await wake.count()) { console.log('waking', url); await wake.click(); await page.waitForTimeout(90000); }
              else console.log('awake', url);
              await page.close();
            }
            await browser.close();
          })();
          JS
          node ping.js
